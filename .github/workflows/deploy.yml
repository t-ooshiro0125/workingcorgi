name: Deploy Astro site to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  discussion:
    types:
      - created
      - edited
      - deleted
      - category_changed
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages-main' || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'discussion' ||
      github.event.discussion.category.slug == 'articles' ||
      (github.event.action == 'category_changed' &&
      github.event.changes.category.from.slug == 'articles')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: >-
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
